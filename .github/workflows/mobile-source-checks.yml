name: Mobile source checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript React Native check
        run: npm run typecheck
      - name: Domain, UI contract, semantic and SQLite host tests
        run: npm run test:all
